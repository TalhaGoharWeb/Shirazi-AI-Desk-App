# Builds a signed release APK and publishes it as a GitHub release.
#
# How to ship an update to users:
#   1. Bump `version:` in pubspec.yaml (e.g. 1.0.1+2) and commit.
#   2. Tag and push:  git tag v1.0.1 && git push origin v1.0.1
#   3. This workflow builds app-release.apk, renames it to
#      shirazi-app-v1.0.1.apk and attaches it to the GitHub release.
#   4. Devices running the app check
#      api.github.com/repos/TalhaGoharWeb/Shirazi-AI-Desk-App/releases/latest
#      on launch (Android) and offer the update in-app.
#
# Note: the APK is signed with the dedicated Shirazi release keystore
# (secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS /
# ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD). Its SHA-1/SHA-256 are
# registered in the Firebase console, so Google Sign-In works on release
# builds and future releases install as updates over each other.
name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/shirazi-release.keystore
          echo "ANDROID_KEYSTORE_PATH=/tmp/shirazi-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "shirazi-app-${TAG}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: shirazi-app-*.apk
          generate_release_notes: true
